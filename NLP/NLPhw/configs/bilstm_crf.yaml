seed: 42

data:
  dataset_name: conll2003
  lowercase: false
  min_freq: 2
  max_vocab_size: 50000
  pretrained_embeddings_path: null

model:
  embedding_dim: 100
  hidden_dim: 256
  lstm_layers: 1
  dropout: 0.33
  word_dropout: 0.05
  freeze_word_embeddings: false
  crf_constraint: none
  use_char_cnn: false
  use_pos_chunk_aux: false
  char_embedding_dim: 30
  char_num_filters: 50
  char_kernel_sizes: [3, 4, 5]

training:
  batch_size: 32
  epochs: 30
  lr: 0.001
  weight_decay: 0.00001
  grad_clip: 5.0
  patience: 6
  num_workers: 0
  aux_loss_weight: 0.2
  scheduler: none
  warmup_ratio: 0.1
  use_amp: false
  accumulation_steps: 1
  ema_decay: 0.0
  use_ema_for_eval: false