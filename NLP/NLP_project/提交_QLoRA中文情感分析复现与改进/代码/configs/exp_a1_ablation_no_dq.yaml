# Ablation A1: disable Double Quantization (all else same as R3)
experiment_id: A1
run_name: a1_ablation_no_dq

model_name_or_path: D:/models/Qwen2.5-7B-Instruct

train_file: data/processed/paper_a_core/train.jsonl
validation_file: data/processed/paper_a_core/val.jsonl
test_file: data/processed/paper_a_core/test.jsonl
output_dir: outputs/a1_ablation_no_dq

max_samples: 0
max_seq_length: 512
seed: 42

# QLoRA — 关闭 Double Quantization
use_4bit: true
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: false
bnb_4bit_compute_dtype: float16
gradient_checkpointing: true
optim: paged_adamw_32bit

# LoRA (same as R3)
lora_r: 64
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules: all-linear

# Training (same as R3)
num_train_epochs: 1
learning_rate: 2.0e-4
weight_decay: 0.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16
logging_steps: 10
save_strategy: steps
save_steps: 10
eval_steps: 200
save_total_limit: 6
save_only_model: true
stop_after_save_file: STOP_TRAINING
bf16: false
fp16: true
